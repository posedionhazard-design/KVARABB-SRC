name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid dpkg

      - name: Setup Theos and iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          mkdir -p $HOME/theos/sdks
          if [ -z "$(ls -A $HOME/theos/sdks 2>/dev/null)" ]; then
            git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks
          fi

      - name: Build and Package KAMUI-Pro
        run: |
          cd KvaraBB

          if [ ! -f "Makefile" ]; then
            echo "HATA: KvaraBB klasörü içerisinde Makefile bulunamadı!"
            exit 1
          fi

          make -j$(sysctl -n hw.ncpu) THEOS=$THEOS
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless THEOS=$THEOS

          echo "--- Oluşan paketler ---"
          ls -la packages/ || true

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAMUI-Pro-Deb
          path: KvaraBB/packages/*.deb
          if-no-files-found: warn

name: Build Theos Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid dpkg ccache
          echo "PATH=/opt/homebrew/opt/ccache/libexec:$PATH" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV

      - name: Restore Build Cache (ccache & SDK objects)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ccache
            KvaraBB/.theos/obj
          key: kamui-pro-cache-${{ runner.os }}-${{ hashFiles('KvaraBB/Makefile', 'KvaraBB/Project/Engine/SDK/**') }}
          restore-keys: |
            kamui-pro-cache-${{ runner.os }}-

      - name: Setup Theos and iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

          mkdir -p $HOME/theos/sdks
          if [ -z "$(ls -A $HOME/theos/sdks 2>/dev/null)" ]; then
            git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks
          fi

      - name: Build and Package KAMUI-Pro
        run: |
          cd KvaraBB

          if [ ! -f "Makefile" ]; then
            echo "HATA: KvaraBB klasörü içerisinde Makefile bulunamadı!"
            exit 1
          fi

          rm -rf packages/*.deb output_dylib

          make -j$(sysctl -n hw.ncpu) THEOS=$THEOS
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless THEOS=$THEOS

          mkdir -p output_dylib
          find .theos/obj -name "KAMUI-Pro.dylib" -exec cp {} output_dylib/ \;
          cp KAMUI-Pro.plist output_dylib/ || true

          echo "--- Oluşan .deb paketleri ---"
          ls -la packages/ || true

          echo "--- Oluşan .dylib dosyaları ---"
          ls -la output_dylib/ || true

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v6
        with:
          name: KAMUI-Pro-Deb
          path: KvaraBB/packages/*.deb
          if-no-files-found: warn

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v6
        with:
          name: KAMUI-Pro-Dylib
          path: KvaraBB/output_dylib/*
          if-no-files-found: warn

name: macOS Makefile Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Repoyu GitHub Actions runner'ına çekme
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Xcode / Command Line Tools Sürüm Bilgisini Kontrol Etme
      - name: Check Environment
        run: |
          xcodebuild -version
          gcc --version

      # 3. KvaraBB Klasörüne Girip Makefile ile Derleme
      - name: Build with Makefile
        run: |
          # Dosyaların bulunduğu alt klasöre geçiş yapıyoruz (Gerekirse dizini uyarlayabilirsiniz)
          cd KvaraBB
          
          # Eğer Makefile içerideyse derlemeyi başlat ve hataları raporla
          if [ -f "Makefile" ]; then
            make
          else
            echo "HATA: KvaraBB klasörü içerisinde Makefile bulunamadı!"
            exit 1
          fi
